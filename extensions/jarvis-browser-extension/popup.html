<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jarvis Browser Companion</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      width: 280px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .badge.connected {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
    }
    .badge.disconnected {
      background: #450a0a;
      color: #f87171;
      border: 1px solid #dc2626;
    }
    .info {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px 8px;
      color: #f1f5f9;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 7px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #38bdf8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Jarvis Companion</span>
    <span id="status-badge" class="badge disconnected">Disconnected</span>
  </div>
  <div class="info">
    Enables Jarvis to detect, reuse, and activate your open tabs instead of opening duplicates.
  </div>

  <div class="form-group">
    <label for="server-url">Jarvis Server URL</label>
    <input type="text" id="server-url" placeholder="http://127.0.0.1:8000" />
  </div>

  <div class="form-group">
    <label for="auth-token">Pairing Token</label>
    <input type="password" id="auth-token" placeholder="Auto-discovered or paste here" />
  </div>

  <button id="save-btn" class="btn">Connect & Save</button>
  <div id="status-msg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
